name: Linux CI

on:
  push:
    branches:
      - linux-compatibility
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYSTRAY_BACKEND: dummy
  PYTHONWARNINGS: error::ResourceWarning

jobs:
  ubuntu-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run full unittest suite
        run: python -B -m unittest discover -s tests -v
      - name: Run repository language audit
        run: python -B audit_repository_language.py

  windows-regression:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run full unittest suite
        run: python -B -m unittest discover -s tests -v
      - name: Run repository language audit
        run: python -B audit_repository_language.py

  linux-onefile:
    needs:
      - ubuntu-tests
      - windows-regression
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Verify Linux builder baseline
        run: |
          test "$(uname -m)" = "x86_64"
          glibc_version="$(ldd --version | head -n 1)"
          printf '%s\n' "$glibc_version"
          printf '%s\n' "$glibc_version" | grep -Eq '2\.35'
      - name: Build Linux onefile executable
        run: python -m PyInstaller --clean --noconfirm LeagueMasteryTracker-linux-onefile.spec
      - name: Verify Linux executable
        run: |
          test -f dist/LeagueMasteryTracker
          test -x dist/LeagueMasteryTracker
          test ! -e dist/LeagueMasteryTracker.exe
          file dist/LeagueMasteryTracker | grep -Eq 'ELF 64-bit.*x86-64'
      - name: Create executable checksum
        working-directory: dist
        run: sha256sum LeagueMasteryTracker > LeagueMasteryTracker.sha256
      - name: Upload Linux onefile artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeagueMasteryTracker-linux-x86_64
          path: |
            dist/LeagueMasteryTracker
            dist/LeagueMasteryTracker.sha256
          if-no-files-found: error
